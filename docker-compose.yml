services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: edubuddy-backend:latest
    ports:
      - "8001:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/edubuddy.db
      - UPLOAD_DIR=./uploads
      - TZ=Asia/Shanghai
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: edubuddy-frontend:latest
    ports:
      - "443:443"
      - "80:80"
    volumes:
      # 挂载 HTTPS 配置与自签名证书（无需重建镜像即可启用 HTTPS）
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./frontend/certs/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - backend
    restart: unless-stopped

