<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" filter="url(#shadow)"/>

  <!-- 灯泡主体（知识象征） -->
  <g transform="translate(100, 100)">
    <!-- 灯泡玻璃部分 -->
    <path d="M -20 -15 Q -35 -5 -35 15 Q -35 35 -20 40 L 20 40 Q 35 35 35 15 Q 35 -5 20 -15 Q 0 -25 -20 -15"
          fill="white" opacity="0.95" stroke="none"/>

    <!-- 灯丝 -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>

    <!-- 灯泡螺纹底座 -->
    <rect x="-15" y="40" width="30" height="8" rx="2" fill="white" opacity="0.9"/>
    <rect x="-12" y="48" width="24" height="4" rx="1" fill="white" opacity="0.8"/>

    <!-- 底部接线柱 -->
    <circle cx="-6" cy="55" r="2.5" fill="white" opacity="0.9"/>
    <circle cx="6" cy="55" r="2.5" fill="white" opacity="0.9"/>

    <!-- 光芒效果（表示激活/学习） -->
    <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="-45" x2="0" y2="-55"/>
      <line x1="32" y1="-32" x2="39" y2="-39"/>
      <line x1="45" y1="0" x2="55" y2="0"/>
      <line x1="32" y1="32" x2="39" y2="39"/>
      <line x1="-32" y1="32" x2="-39" y2="39"/>
      <line x1="-45" y1="0" x2="-55" y2="0"/>
      <line x1="-32" y1="-32" x2="-39" y2="-39"/>
    </g>
  </g>

  <!-- 装饰圆环（表示AI/数据流通） -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
</svg>
